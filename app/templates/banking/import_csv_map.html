{% extends "base.html" %}
{% block content %}
<h2>Étape 1 : Associer les colonnes du CSV</h2>

<form method="post" id="mapping-form">
  <div class="mb-3">
        <label>Date *</label>
        <select name="col_date" required>
            <option value="">-- Choisir --</option>
            {% for h in session.csv_headers %}
                <option value="{{ h }}">{{ h }}</option>
            {% endfor %}
        </select>
        
        <!-- FORMAT DE DATE -->
        <select name="date_format" required>
            <option value="%Y-%m-%d">YYYY-MM-DD (2022-01-03)</option>
            <option value="%Y/%m/%d">YYYY/MM/DD (2022/01/03)</option>
            <option value="%d-%m-%Y">DD-MM-YYYY (03-01-2022)</option>
            <option value="%d/%m/%Y">DD/MM/YYYY (03/01/2022)</option>
            <option value="%d.%m.%Y">DD.MM.YYYY (03.01.2022)</option>
            <option value="%m-%d-%Y">MM-DD-YYYY (01-03-2022)</option>
            <option value="%m/%d/%Y">MM/DD/YYYY (01/03/2022)</option>
            <option value="%d-%m-%y">DD-MM-YY (03-01-22)</option>
            <option value="%d/%m/%y">DD/MM/YY (03/01/22)</option>
            <option value="%d.%m.%y">DD.MM.YY (03.01.22)</option>
            <option value="%Y-%m-%d %H:%M">YYYY-MM-DD HH:MM (2022-01-03 14:30)</option>
            <option value="%d-%m-%Y %H:%M">DD-MM-YYYY HH:MM (03-01-2022 14:30)</option>
            <option value="%d/%m/%Y %H:%M">DD/MM/YYYY HH:MM (03/01/2022 14:30)</option>
            <option value="%d.%m.%Y %H:%M">DD.MM.YYYY HH:MM (03.01.2022 14:30)</option>
        </select>
    </div>
  <div class="mb-3">
    <label>Montant
      <select name="col_montant" class="form-select" required>
        {% for h in session.csv_headers %}
        <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="mb-3">
    <label>Type (depot/retrait/transfert)
      <select name="col_type" class="form-select" required>
        {% for h in session.csv_headers %}
        <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="mb-3">
    <label>Description
      <select name="col_description" class="form-select">
        <option value="">-- Aucune --</option>
        {% for h in session.csv_headers %}
        <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="mb-3">
    <label>Compte source
      <select name="col_source" class="form-select" required>
        {% for h in session.csv_headers %}
        <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <div class="mb-3">
    <label>Compte destination (optionnel)
      <select name="col_dest" class="form-select">
        <option value="">-- Aucune --</option>
        {% for h in session.csv_headers %}
        <option value="{{ h }}">{{ h }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
</form>

<button form="mapping-form" formaction="{{ url_for('banking.import_csv_confirm') }}" class="btn btn-primary">
  Continuer : valider ligne par ligne
</button>

<button form="mapping-form" formaction="{{ url_for('banking.import_csv_distinct_confirm') }}"
  class="btn btn-success mt-2">
  Continuer : associer par nom de compte (recommandé)
</button>

<a href="{{ url_for('banking.import_csv_upload') }}" class="btn btn-secondary mt-3">← Retour</a>
{% endblock %}
