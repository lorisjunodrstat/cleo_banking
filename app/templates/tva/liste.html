{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Gestion des Taux de TVA</h2>
    
    <!-- Formulaire d'ajout rapide -->
    <div class="card mb-4">
        <div class="card-header">Ajouter un nouveau taux</div>
        <div class="card-body">
            <form action="{{ url_for('banking.creer_taux_tva') }}" method="POST" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">Année</label>
                    <input type="number" name="annee" class="form-control" value="2024" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nom du taux</label>
                    <input type="text" name="nom" class="form-control" placeholder="Ex: Taux normal" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Taux (%)</label>
                    <input type="text" name="taux" class="form-control" placeholder="8.10" step="0.01" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pays</label>
                    <input type="text" name="pays" class="form-control" placeholder="Ex: Suisse" required>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Ajouter</button>
                </div</form>
        </div>
    </div>

    <!-- Tableau des taux -->
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Année</th>
                <th>Pays</th>
                <th>Nom</th>
                <th>Taux (%)</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for t in taux %}
            <tr>
                <form action="{{ url_for('banking.modifier_taux_tva', taux_id=t.id) }}" method="POST" class="row g-2 w-100 align-items-center">
                    <td class="col-md-2">
                        <input type="number" name="annee" class="form-control form-control-sm" value="{{ t.annee }}" required>
                    </td>
                    <td class="col-md-3">
                        <input type="text" name="pays" class="form-control form-control-sm" value="{{ t.pays }}" required>
                    <td class="col-md-4">
                        <input type="text" name="nom" class="form-control form-control-sm" value="{{ t.nom }}" required>
                    </td>
                    <td class="col-md-3">
                        <input type="text" name="taux" class="form-control form-control-sm" value="{{ t.taux }}" step="0.01" required>
                    </td>
                    <td class="col-md-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="actif" {% if t.actif %}checked{% endif %}>
                            <label class="form-check-label">Actif</label>
                        </div>
                    </td>
                    <td class="col-md-1 d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-success">💾</button>
                    </td>
                </form>
                <form action="{{ url_for('banking.supprimer_taux_tva', taux_id=t.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Supprimer ce taux ?');">
                    <button type="submit" class="btn btn-sm btn-danger">🗑️</button>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
