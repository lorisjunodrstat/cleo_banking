{% extends "pos.html" %}
{% block title %}Nouveau modificateur{% endblock %}
{% block page_header %}<h2 class="mb-4">Créer un nouveau modificateur</h2>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nom du modificateur</label>
                        <input type="text" name="nom_modificateur" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prix du modificateur</label>
                        <input type="number" step="0.01" name="prix_modificateur" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optionnel)</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Enregistrer le modificateur</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
