{% extends "pos.html" %}

{% block title %}Créer une sous-categorie{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            {% if sous_categorie %}
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Nom de la sous-catégorie</label>
                            <input type="text" name="nom_sous_categorie" class="form-control" value="sous_categorie.nom" required>
                        </div>
                        <div class="mb3">
                            <div class="col-md-6">
                            <label class="form-label">Catégorie</label>
                            <select name="id_categorie" class="form-select" value="{{ sous_categorie.id_categorie if sous_categorie else '' }}" required>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.nom_categorie }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description (optionnel)</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Enregistrer la catégorie</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
