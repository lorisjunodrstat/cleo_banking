{% extends "pos.html" %}
{% block title %}Nouvelle option de restauration{% endblock %}

{% block page_header %}<h2 class="mb-4">Ajouter une option de restauration</h2>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nom de l'option</label>
                        <input type="text" name="nom" class="form-control" 
                               placeholder="Ex: Livré, À emporter, Sur place" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optionnel)</label>
                        <textarea name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" name="est_actif" class="form-check-input" id="est_actif" checked>
                        <label class="form-check-label" for="est_actif">Activer cette option</label>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-check-circle me-1"></i>Enregistrer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
