{% extends "pos.html" %}
{% block title %}Modifier Modificateur{% endblock %}
{% block page_header %}<h2 class="mb-4">Modifier Modificateur</h2>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nom du modificateur *</label>
                        <input type="text" name="nom_modificateur" class="form-control" value="{{ modifier.nom_modificateur }}" required>
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Prix par défaut (CHF)</label>
                            <input type="number" step="0.01" name="prix_modificateur" class="form-control" value="{{ modifier.prix_modificateur or 0 }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Taux de TVA par défaut (%)</label>
                            <select name="taux_tva" class="form-select" required>
                                {% for taux in taux_disponibles %}
                                    <option value="{{ taux.taux }}" 
                                        {% if (modifier.taux_tva | default(0) | float) == (taux.taux | float) %}selected{% endif %}>
                                        {{ taux.nom }} ({{ taux.taux }}%)
                                    </option>
                                {% else %}
                                    <option value="0.00">Aucun taux configuré (0%)</option>
                                {% endfor %}
                            </select>
                            <div class="form-text">Taux appliqué aux options qui n'ont pas de taux spécifique.</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description (optionnel)</label>
                        <textarea name="description" class="form-control" rows="3">{{ modifier.description or '' }}</textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle me-2"></i>Enregistrer les modifications
                        </button>
                        <a href="{{ url_for('banking.pos_modifiers_list') }}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
