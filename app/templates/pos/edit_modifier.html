{%- extends "pos.html" -%}
{% block title %}Taxes{% endblock %}
{% block page_header %}<h2 class="mb-4">Modifier Modifier</h2>{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nom de l'option</label>
                            <input type="text" name="nom_option" class="form-control" value="{{ modifier.nom_option }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Prix de l'option</label>
                            <input type="number" step="0.01" name="prix_option" class="form-control" value="{{ modifier.prix_option }}" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Enregistrer l'option</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
