{% extends "pos.html" %}
{% block title %}Nouveau point de vente{% endblock %}
{% block page_header %}<h2 class="mb-4">Créer un nouveau point de vente</h2>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nom du PDV</label>
                        <input type="text" name="nom_pdv" class="form-control" placeholder="Ex: Caisse Principale" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Magasin</label>
                        <select name="magasin_id" class="form-select" required>
                            {% for magasin in magasins %}
                                <option value="{{ magasin.id }}">{{ magasin.nom_magasin }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Compte bancaire de rattachement</label>
                        <select name="compte_bancaire_id" class="form-select" required>
                            <option value="">-- Sélectionner un compte --</option>
                            {% for compte in comptes %}
                                <option value="{{ compte.id }}">
                                    {{ compte.nom_compte }} 
                                    {% if compte.iban %}({{ compte.iban[-4:] }}){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                        <div class="form-text text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Toutes les ventes de ce PDV seront automatiquement enregistrées comme des dépôts sur ce compte.
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('banking.pos_pdv_list') }}" class="btn btn-secondary flex-grow-1">Annuler</a>
                        <button type="submit" class="btn btn-success flex-grow-1">Enregistrer le PDV</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
