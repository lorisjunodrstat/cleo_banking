{% extends "pos.html" %}
{% block title %}Nouvel article{% endblock %}
{% block page_header %}<h2 class="mb-4">Créer un nouvel article</h2>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <!-- Nom de l'article -->
                    <div class="mb-3">
                        <label class="form-label">Nom de l'article</label>
                        <input type="text" name="nom_article" class="form-control" placeholder="Ex: Café Espresso" required>
                    </div>
                    
                    <!-- Catégorie et Sous-catégorie -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Catégorie</label>
                            <select name="id_categorie" class="form-select" required>
                                <option value="" disabled selected>Choisir une catégorie</option>
                                {% for cat in categories %}
                                    <option value="{{ cat.id }}">{{ cat.nom_categorie }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Sous-catégorie (optionnel)</label>
                            <select name="id_sous_categorie" class="form-select">
                                <option value="">Aucune</option>
                                {% for sous_cat in sous_categories %}
                                    <option value="{{ sous_cat.id }}">{{ sous_cat.nom_sous_categorie }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Prix, Coût et Taxe (Alignés sur 3 colonnes) -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Prix unitaire (CHF)</label>
                            <input type="number" step="0.01" name="prix_unitaire" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Coût unitaire (CHF)</label>
                            <input type="number" step="0.01" name="cout_unitaire" class="form-control" placeholder="0.00" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Type de taxe applicable</label>
                            <select name="type_taxe_id" class="form-select">
                                <option value="">Aucune (0%)</option>
                                {% for type_taxe in types_taxes %}
                                    <option value="{{ type_taxe.id }}" {% if type_taxe.est_actif %}selected{% endif %}>
                                        {{ type_taxe.nom }}{% if type_taxe.taux_actuel %} (Actuellement {{ type_taxe.taux_actuel }}%){% endif %}
                                    </option>
                                {% endfor %}
                            </select>
                            <div class="form-text" style="font-size: 0.8em;">
                                <i class="bi bi-info-circle"></i> Le taux en vigueur au moment de la vente sera appliqué automatiquement.
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label">Description (optionnel)</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Détails sur l'article..."></textarea>
                    </div>

                    <!-- Prix variable -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="is_variable_price" id="is_variable_price">
                        <label class="form-check-label" for="is_variable_price">
                            Prix variable (le caissier pourra modifier le prix manuellement lors de la vente)
                        </label>
                    </div>

                    <!-- Bouton d'action -->
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-save"></i> Enregistrer l'article
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
