{% extends "base.html" %}
{% block content %}
<div class="container">
  <h1>Nouveau rapprochement bancaire</h1>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3">
      <div class="col-md-6">
        <label>Prestataire</label>
        <input type="text" name="prestataire" class="form-control" required
               placeholder="Concardis / Eat.ch / Twint...">
      </div>
      <div class="col-md-6">
        <label>Référence relevé</label>
        <input type="text" name="reference_releve" class="form-control"
               placeholder="Ex : CONCARDIS-2022-07">
      </div>

      <div class="col-md-4">
        <label>Compte banque (débit)</label>
        <select name="compte_banque_id" class="form-select" required>
          {% for c in categories %}
            {% if c.type_compte == 'Actif' %}
            <option value="{{ c.id }}">{{ c.numero }} — {{ c.nom }}</option>
            {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label>Compte frais (débit)</label>
        <select name="compte_frais_id" class="form-select" required>
          {% for c in categories %}
            {% if c.type_compte in ('Charge','Charges') %}
            <option value="{{ c.id }}">{{ c.numero }} — {{ c.nom }}</option>
            {% endif %}
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label>Compte attente (crédit)</label>
        <select name="compte_attente_id" class="form-select" required>
          {% for c in categories %}
            {% if c.type_compte == 'Actif' %}
            <option value="{{ c.id }}">{{ c.numero }} — {{ c.nom }}</option>
            {% endif %}
          {% endfor %}
        </select>
      </div>

      <div class="col-md-3">
        <label>Début période</label>
        <input type="date" name="date_debut" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Fin période</label>
        <input type="date" name="date_fin" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Date versement</label>
        <input type="date" name="date_versement" class="form-control" required>
      </div>

      <div class="col-md-3">
        <label>Montant brut</label>
        <input type="number" step="0.01" name="montant_brut" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Commission</label>
        <input type="number" step="0.01" name="montant_commission" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label>Net reçu</label>
        <input type="number" step="0.01" name="montant_net" class="form-control" required>
      </div>
    </div>

    <div class="mt-4">
      <button class="btn btn-primary">Créer (brouillon)</button>
      <a href="{{ url_for('banking.liste_rapprochements') }}" class="btn btn-secondary">Retour</a>
    </div>
  </form>
</div>
{% endblock %}
